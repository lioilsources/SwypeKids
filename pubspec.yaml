name: swype_kids
description: Výuková hra pro děti – učíme se písmenka swyp tahem po klávesnici.
publish_to: none
version: 2.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master.png"
  remove_alpha_ios: true
  background_color_ios: "#E8D7B3"
  adaptive_icon_background: "#E8D7B3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon_master.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_master.png"
    icon_size: 256

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900
