name: swype_kids
description: Výuková hra pro děti – učíme se písmenka swyp tahem po klávesnici.
publish_to: none
version: 2.9.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^4.1.7
  flutter_tts: ^4.0.0
  intl: ^0.20.2
  shared_preferences: ^2.3.0
  # Shared kid typography. For local development next to the package, add
  #   dependency_overrides: {cute_kid_fonts: {path: <path to CuteKidFonts>}}
  cute_kid_fonts:
    git:
      url: https://github.com/lioilsources/CuteKidFonts.git
      ref: v0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master.png"
  remove_alpha_ios: true
  background_color_ios: "#E8D7B3"
  adaptive_icon_background: "#E8D7B3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
  macos:
    generate: true
    image_path: "assets/icon/icon_master.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_master.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/packs/
    - assets/characters/panda/
    - assets/emoji/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/ambient/
    - assets/audio/music/
  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: fonts/OpenDyslexic-Regular.otf
        - asset: fonts/OpenDyslexic-Bold.otf
          weight: 700
